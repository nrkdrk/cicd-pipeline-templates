# Serves a single-page application built by Vite.
#
# Port 8080, not 80: the unprivileged Nginx image runs as a non-root user and a
# non-root process cannot bind to a port below 1024.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # The pipeline checks this endpoint after a rollout.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Vite writes content-hashed file names, so these can be cached forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths must still return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
