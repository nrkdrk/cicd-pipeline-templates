# React / Vite pipeline for Azure DevOps - the same work as github-actions.yml.
#
# HOW TO USE
#   1. Copy this file to your repository root as azure-pipelines.yml.
#   2. Change workingDirectory below.
#   3. Create a Docker Registry service connection and put its name in
#      the containerRegistry variable.

trigger:
  branches:
    include: [main]
  tags:
    include: ['v*']

pr:
  branches:
    include: [main]

variables:
  nodeVersion: '22.x'
  workingDirectory: '$(Build.SourcesDirectory)'
  containerRegistry: 'my-registry-connection'
  imageName: 'react-app'
  imageTag: $[ replace(variables['Build.SourceBranch'], 'refs/tags/v', '') ]

stages:
  - stage: Test
    displayName: Lint, test and build
    jobs:
      - job: Node
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Select Node $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: 'Cache npm packages'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(HOME)/.npm

          - script: npm ci
            workingDirectory: $(workingDirectory)
            displayName: 'Install dependencies'

          - script: npm run lint
            workingDirectory: $(workingDirectory)
            displayName: 'Lint'

          - script: npm test
            workingDirectory: $(workingDirectory)
            displayName: 'Test'

          - script: npm run build
            workingDirectory: $(workingDirectory)
            displayName: 'Build'

  - stage: BuildAndPush
    displayName: Build and push image
    dependsOn: Test
    condition: >-
      and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: Docker
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build and push'
            inputs:
              command: buildAndPush
              containerRegistry: $(containerRegistry)
              repository: $(imageName)
              dockerfile: $(workingDirectory)/Dockerfile
              buildContext: $(workingDirectory)
              tags: |
                $(imageTag)
                $(Build.SourceVersion)
              arguments: '--build-arg APP_VERSION=$(imageTag)'
