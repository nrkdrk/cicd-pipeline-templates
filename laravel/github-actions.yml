# Laravel pipeline for GitHub Actions.
#
# HOW TO USE
#   1. Copy this file to .github/workflows/ci.yml in your project.
#   2. Change WORKING_DIRECTORY below if the app is not in the repository root.
#   3. Copy laravel/Dockerfile next to your application.
#
# WHAT IT DOES
#   test  - runs PHPUnit on every push and pull request
#   build - builds a multi-stage image and pushes it to GHCR, but only for
#           pushes to main and for version tags (v1.2.3). Pull requests never push.

name: laravel-ci

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

# Cancel an older run when a new commit arrives on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  WORKING_DIRECTORY: '.'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Testing two versions proves the package is not pinned to one runtime.
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, bcmath, pdo_sqlite, sqlite3
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: php artisan test

  build:
    name: Build and push image
    needs: test
    # Pull requests are tested but never published.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # required for keyless signing with cosign
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Turns Git refs into image tags: v1.2.3 -> 1.2.3, 1.2, latest
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          # The GitHub Actions cache keeps the Composer layer between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional but cheap: a keyless signature proves this image came from
      # this workflow. Verify it with:
      #   cosign verify ghcr.io/OWNER/REPO:TAG \
      #     --certificate-identity-regexp '.*' --certificate-oidc-issuer-regexp '.*'
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done
