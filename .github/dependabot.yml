# Pinning actions to a SHA freezes them, which is the point - but frozen also
# means unpatched. Dependabot understands SHA pins with a version comment and
# opens a pull request when the tag moves, so the pin stays deliberate.
#
# Only two ecosystems are watched. The example applications are evidence that
# the templates work, not products with users: chasing their dev dependencies
# produces noise and breaks the build on major bumps nobody asked for.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /laravel
      - /dotnet
      - /react
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      base-images:
        patterns: ['*']