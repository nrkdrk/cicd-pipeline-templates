# This is dotnet/github-actions.yml applied to examples/dotnet-api.
# The badge in the README points here, so the template is proven, not promised.

name: dotnet-example

on:
  push:
    branches: [main]
    paths:
      - 'examples/dotnet-api/**'
      - 'dotnet/**'
      - '.github/workflows/dotnet-example.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/dotnet-api/**'
      - 'dotnet/**'
      - '.github/workflows/dotnet-example.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIRECTORY: examples/dotnet-api
  TEST_PROJECT: tests/PlatformApi.Tests/PlatformApi.Tests.csproj
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore

      - name: Run tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Build the example image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: examples/dotnet-api
          file: dotnet/Dockerfile
          push: false
          load: true
          tags: dotnet-ci-example:ci
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name example -p 8080:8080 dotnet-ci-example:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then echo "\nhealthy"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs example; exit 1

      # The example images are never pushed, so this is the only gate on them.
      - name: Scan the image
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8  # master
        with:
          image-ref: dotnet-ci-example:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
