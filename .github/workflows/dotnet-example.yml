# This is dotnet/github-actions.yml applied to examples/dotnet-api.
# The badge in the README points here, so the template is proven, not promised.

name: dotnet-example

on:
  push:
    branches: [main]
    paths:
      - 'examples/dotnet-api/**'
      - 'dotnet/**'
      - '.github/workflows/dotnet-example.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIRECTORY: examples/dotnet-api
  TEST_PROJECT: tests/PlatformApi.Tests/PlatformApi.Tests.csproj
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore

      - name: Run tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only, no push: the example image has no reason to exist in a registry.
      - name: Build the example image
        uses: docker/build-push-action@v6
        with:
          context: examples/dotnet-api
          file: dotnet/Dockerfile
          push: false
          load: true
          tags: dotnet-ci-example:ci
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name example -p 8080:8080 dotnet-ci-example:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then echo "\nhealthy"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs example; exit 1
