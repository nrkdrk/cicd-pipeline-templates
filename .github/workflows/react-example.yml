# This is react/github-actions.yml applied to examples/react-app.
# The badge in the README points here, so the template is proven, not promised.

name: react-example

on:
  push:
    branches: [main]
    paths:
      - 'examples/react-app/**'
      - 'react/**'
      - '.github/workflows/react-example.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/react-app/**'
      - 'react/**'
      - '.github/workflows/react-example.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIRECTORY: examples/react-app

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: examples/react-app/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run lint

      - name: Test
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm test

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run build

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build the example image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: examples/react-app
          file: react/Dockerfile
          push: false
          load: true
          tags: react-ci-example:ci
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name example -p 8080:8080 react-ci-example:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then echo "\nhealthy"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs example; exit 1

      # The example images are never pushed, so this is the only gate on them.
      - name: Scan the image
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8  # master
        with:
          image-ref: react-ci-example:ci
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
