# This is laravel/github-actions.yml applied to examples/laravel-app.
# The badge in the README points here, so the template is proven, not promised.

name: laravel-example

on:
  push:
    branches: [main]
    paths:
      - 'examples/laravel-app/**'
      - 'laravel/**'
      - '.github/workflows/laravel-example.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIRECTORY: examples/laravel-app

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, bcmath, pdo_sqlite, sqlite3
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('examples/laravel-app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: php artisan test

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only, no push: the example image has no reason to exist in a registry.
      - name: Build the example image
        uses: docker/build-push-action@v6
        with:
          context: examples/laravel-app
          file: laravel/Dockerfile
          push: false
          load: true
          tags: laravel-ci-example:ci
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name example -p 8080:8080 \
            -e APP_KEY=base64:$(head -c 32 /dev/urandom | base64) \
            laravel-ci-example:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then echo "\nhealthy"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs example; exit 1
