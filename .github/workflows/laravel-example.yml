# This is laravel/github-actions.yml applied to examples/laravel-app.
# The badge in the README points here, so the template is proven, not promised.

name: laravel-example

on:
  push:
    branches: [main]
    paths:
      - 'examples/laravel-app/**'
      - 'laravel/**'
      - '.github/workflows/laravel-example.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIRECTORY: examples/laravel-app

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, bcmath, pdo_sqlite, sqlite3
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('examples/laravel-app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: php artisan test

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Build the example image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: examples/laravel-app
          file: laravel/Dockerfile
          push: false
          load: true
          tags: laravel-ci-example:ci
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name example -p 8080:8080 \
            -e APP_KEY=base64:$(head -c 32 /dev/urandom | base64) \
            laravel-ci-example:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then echo "\nhealthy"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs example; exit 1

      # The example images are never pushed, so this is the only gate on them.
      - name: Scan the image
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8  # master
        with:
          image-ref: laravel-ci-example:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
