# A callable version of laravel/github-actions.yml.
#
# The rest of this repository ships templates you copy. This file is the other
# option: one pipeline, called from many repositories, updated in one place.
# docs/reuse.md explains when each is the right choice.
#
# Call it from another repository like this:
#
#   jobs:
#     ci:
#       uses: nrkdrk/cicd-pipeline-templates/.github/workflows/reusable-laravel.yml@v1
#       with:
#         working-directory: .
#         image-name: ${{ github.repository }}
#       permissions:
#         contents: read
#         packages: write
#         id-token: write
#
# Pin the call to a tag or a SHA, never to a branch: @main means this repository
# can change what runs in your pipeline without you doing anything.

name: reusable-laravel

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing composer.json
        type: string
        default: '.'
      php-versions:
        description: JSON array of PHP versions to test against
        type: string
        default: '["8.2", "8.3"]'
      image-name:
        description: Image repository, without the registry prefix
        type: string
        required: true
      registry:
        description: Container registry
        type: string
        default: ghcr.io
      push:
        description: Push the image after a successful scan
        type: boolean
        default: true
      trivy-severity:
        description: Severities that fail the build
        type: string
        default: 'HIGH,CRITICAL'

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, bcmath, pdo_sqlite, sqlite3
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        working-directory: ${{ inputs.working-directory }}
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        working-directory: ${{ inputs.working-directory }}
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: php artisan test

  build:
    name: Build and push image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to the container registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/Dockerfile
          push: false
          load: true
          tags: scan-target:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0  # master
        with:
          image-ref: scan-target:${{ github.sha }}
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: ${{ inputs.trivy-severity }}

      - name: Generate an SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: scan-target:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom.spdx.json

      - name: Push the image
        id: push
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha

      - name: Attest build provenance
        if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
