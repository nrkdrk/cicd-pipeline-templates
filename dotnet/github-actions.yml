# .NET pipeline for GitHub Actions.
#
# HOW TO USE
#   1. Copy this file to .github/workflows/ci.yml in your project.
#   2. Change WORKING_DIRECTORY and PROJECT_PATH below.
#   3. Copy dotnet/Dockerfile next to your solution.
#
# WHAT IT DOES
#   test  - restores, builds and runs the tests on every push and pull request
#   build - builds a multi-stage image and pushes it to GHCR, but only for
#           pushes to main and for version tags (v1.2.3). Pull requests never push.

name: dotnet-ci

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  WORKING_DIRECTORY: '.'
  TEST_PROJECT: 'tests/PlatformApi.Tests/PlatformApi.Tests.csproj'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Nothing to phone home about from a build agent.
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # Caches the NuGet packages between runs.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore

      - name: Run tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  build:
    name: Build and push image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # required for keyless signing with cosign
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to the container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Turns Git refs into image tags: v1.2.3 -> 1.2.3, 1.2, latest
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      # Build locally first so the image can be inspected before anyone can pull it.
      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
          push: false
          load: true
          tags: scan-target:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails the job on HIGH and CRITICAL findings, before the image is public.
      - name: Scan the image
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8  # master
        with:
          image-ref: scan-target:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Answers "do we ship the affected package?" on the day a CVE lands.
      - name: Generate an SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: scan-target:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom.spdx.json

      # Every layer is already cached from the build above, so this is fast.
      - name: Push the image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha

      # Records which repository, commit and workflow produced this image.
      #   gh attestation verify oci://ghcr.io/OWNER/REPO:TAG --owner OWNER
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done
